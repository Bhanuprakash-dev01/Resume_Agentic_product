<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Quality Supervisor Dashboard</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
      .header { background: #111827; color: white; padding: 1rem 2rem; }
      .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
      .card { background: white; border-radius: 12px; padding: 1rem 1.2rem; box-shadow: 0 3px 10px rgba(15,23,42,0.08); }
      .card h3 { margin: 0 0 0.5rem; color: #475569; font-size: 0.8rem; text-transform: uppercase; }
      .card strong { font-size: 2rem; }
      .section { background: white; border-radius: 12px; padding: 1rem 1.2rem; box-shadow: 0 3px 10px rgba(15,23,42,0.08); }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 1rem 0; }
      .form-grid label { display: grid; gap: 0.35rem; color: #475569; font-size: 0.9rem; }
      .form-grid input, .form-grid textarea { box-sizing: border-box; width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      .form-grid textarea { min-height: 5rem; resize: vertical; }
      .form-status { margin-top: 1rem; }
      .result { max-height: 30rem; overflow: auto; padding: 1rem; background: #f8fafc; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { padding: 0.7rem 0.8rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
      button { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 0.6rem 1rem; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      .status { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: bold; }
      .queued { background: #e0f2fe; color: #075985; }
      .processing { background: #fef3c7; color: #92400e; }
      .completed { background: #dcfce7; color: #166534; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Product Quality Supervisor Dashboard</h1>
      <a href="/observability" style="color: #bfdbfe;">Product-quality observability</a>
    </div>
    <div class="container">
      <div class="cards" id="summaryCards"></div>

      <div class="section">
        <h2>Recent review decisions</h2>
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Decision</th>
              <th>Reviewer</th>
              <th>Notes</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="reviewRows"></tbody>
        </table>
      </div>

      <div class="section" style="margin-top: 1.5rem;">
        <h2>Analyze a product</h2>
        <form id="analyzeForm">
          <div class="form-grid">
            <label>SKU *
              <input name="sku" required />
            </label>
            <label>Title *
              <input name="title" required />
            </label>
            <label>Category *
              <input name="category" required />
            </label>
            <label>Brand *
              <input name="brand" required />
            </label>
            <label>Color
              <input name="color" />
            </label>
            <label>Storage
              <input name="storage" />
            </label>
            <label>Price
              <input name="price" type="number" step="any" />
            </label>
            <label>GTIN
              <input name="gtin" />
            </label>
            <label>Model
              <input name="model" />
            </label>
            <label>Weight
              <input name="weight" />
            </label>
            <label>Dimensions
              <input name="dimensions" />
            </label>
            <label style="grid-column: 1 / -1;">Description
              <textarea name="description"></textarea>
            </label>
          </div>
          <button id="analyzeBtn" type="submit">Analyze product</button>
          <p id="analysisStatus" class="form-status" role="status" aria-live="polite"></p>
        </form>
        <pre id="analysisResult" class="result" hidden></pre>
      </div>

      <div class="section" style="margin-top: 1.5rem;">
        <h2>Run batch review</h2>
        <label>Batch size: <input id="batchSize" type="number" min="1" max="1000" value="50" /></label>
        <button id="runBatchBtn" style="margin-left: 0.7rem;">Process batch</button>
        <div id="jobStatus" style="margin-top: 1rem;"></div>
      </div>
    </div>

    <script>
      async function loadDashboard() {
        const summaryResp = await fetch('/api/dashboard');
        const summary = await summaryResp.json();

        const cards = document.getElementById('summaryCards');
        const reviewCounts = summary.review_counts || {};
        const total = summary.review_total || 0;
        const latestJob = summary.latest_job || {};

        cards.innerHTML = `
          <div class="card"><h3>Total reviews</h3><strong>${total}</strong></div>
          <div class="card"><h3>HUMAN_REVIEW</h3><strong>${reviewCounts.HUMAN_REVIEW || 0}</strong></div>
          <div class="card"><h3>PASS</h3><strong>${reviewCounts.PASS || 0}</strong></div>
          <div class="card"><h3>BLOCK</h3><strong>${reviewCounts.BLOCK || 0}</strong></div>
          <div class="card"><h3>Latest job</h3><strong>${latestJob.status || 'n/a'}</strong></div>
        `;

        const reviewsResp = await fetch('/api/reviews');
        const reviews = await reviewsResp.json();
        const rows = document.getElementById('reviewRows');
        rows.innerHTML = (reviews.items || []).map(item => `
          <tr>
            <td>${item.product_id}</td>
            <td><span class="status ${item.decision.toLowerCase() || 'completed'}">${item.decision}</span></td>
            <td>${item.reviewer}</td>
            <td>${item.notes || ''}</td>
            <td>${new Date(item.created_at).toLocaleString()}</td>
          </tr>
        `).join('') || '<tr><td colspan="5">No review records yet.</td></tr>';
      }

      document.getElementById('runBatchBtn').addEventListener('click', async () => {
        const batchSize = document.getElementById('batchSize').value;
        const response = await fetch('/api/jobs/process_batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ batch_size: Number(batchSize) })
        });
        const payload = await response.json();
        document.getElementById('jobStatus').innerHTML = `Job queued: <strong>${payload.job_id}</strong> (${payload.status})`;
        await loadDashboard();
      });

      document.getElementById('analyzeForm').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = document.getElementById('analyzeBtn');
        const status = document.getElementById('analysisStatus');
        const result = document.getElementById('analysisResult');
        const formValues = Object.fromEntries(new FormData(form).entries());
        const payload = {
          ...formValues,
          price: formValues.price === '' ? null : Number(formValues.price),
          color: formValues.color || null,
          storage: formValues.storage || null,
          model: formValues.model || null,
          gtin: formValues.gtin || null,
          weight: formValues.weight || null,
          dimensions: formValues.dimensions || null
        };

        button.disabled = true;
        status.textContent = 'Analyzing product…';
        result.hidden = true;
        try {
          const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const report = await response.json();
          if (!response.ok) {
            const detail = typeof report.detail === 'string' ? report.detail : JSON.stringify(report.detail || report);
            throw new Error(detail);
          }
          result.textContent = JSON.stringify(report, null, 2);
          result.hidden = false;
          status.textContent = `Analysis complete: ${report.decision}`;
        } catch (error) {
          status.textContent = `Analysis failed: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });

      loadDashboard();
      setInterval(loadDashboard, 15000);
    </script>
  </body>
</html>
